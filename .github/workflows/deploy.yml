name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
      NEXT_PUBLIC_CUSTOM_DOMAIN: ${{ vars.NEXT_PUBLIC_CUSTOM_DOMAIN }}
      NEXT_PUBLIC_THEME_PRESET: ${{ vars.NEXT_PUBLIC_THEME_PRESET }}
      NEXT_PUBLIC_ADSTERRA_NATIVE_SCRIPT_URL: ${{ secrets.NEXT_PUBLIC_ADSTERRA_NATIVE_SCRIPT_URL }}
      NEXT_PUBLIC_ADSTERRA_NATIVE_CONTAINER_ID: ${{ secrets.NEXT_PUBLIC_ADSTERRA_NATIVE_CONTAINER_ID }}
      BING_SITE_VERIFICATION: ${{ secrets.BING_SITE_VERIFICATION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check repository rules
        run: node scripts/repo-rules.mjs ci "$BEFORE" "$GITHUB_SHA"
        env:
          BEFORE: ${{ github.event.before }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live published URLs and crawlability
        run: |
          python3 - <<'PY'
          import re, time, urllib.request
          base = "https://make-ramen-to-get-rich.github.io/"
          paths = ["", "how-to-play/", "how-to-make-money/", "how-to-get-followers/", "mukbang-guide/", "gamepasses/"]
          def request(path, required):
              url = base + path
              last_error = None
              for attempt in range(12):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent":"RamenSiteLaunchQA/1.0"})
                      with urllib.request.urlopen(req, timeout=20) as response:
                          html = response.read().decode("utf-8")
                          assert response.status == 200, f"{response.status} for {url}"
                          for marker in required:
                              assert marker in html, f"Missing {marker!r} on {url}"
                          return html
                  except Exception as e:
                      last_error = e
                      print(f"Retry {attempt+1}/12 for {url}: {e}", flush=True)
                      time.sleep(5)
              raise RuntimeError(f"Live check failed for {url}: {last_error}")
          for path in paths:
              canonical = base + path
              marker = "soft-guide-hero-grid" if not path else "skin-article-hero"
              html = request(path,[canonical, marker, "Make Ramen To Get Rich", "G-8CMRKXJN4S", "<footer"])
              assert not re.search(r'<meta[^>]+content="[^"]*noindex', html, re.I), f"Unindexable {path}"
              print("LIVE 200 AND SEO OK: " + canonical, flush=True)
          robots=request("robots.txt", ["Allow: /", "sitemap.xml"])
          assert "Disallow: /" not in robots, "Site accidentally disallowed"
          sitemap=request("sitemap.xml", ["how-to-play/", "gamepasses/"])
          assert sitemap.count("<loc>") == 6, "Incorrect live sitemap page count"
          print("LIVE PASS: 6/6 HTML pages, shared footer, GA4, indexability, robots.txt and sitemap.xml", flush=True)
          PY
