name: Repository rules

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repo-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check commit policy and private research materials
        run: node scripts/repo-rules.mjs ci "$BEFORE" "$AFTER"
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Validate exported SEO pages and public files
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const root = 'https://make-ramen-to-get-rich.github.io/';
          const routes = ['', 'how-to-play', 'how-to-make-money', 'how-to-get-followers', 'mukbang-guide', 'gamepasses'];
          const read = file => fs.readFileSync(path.join('out', file), 'utf8');
          const sitemap = read('sitemap.xml');
          for (const slug of routes) {
            const file = slug ? path.join(slug,'index.html') : 'index.html';
            const html = read(file);
            const canonical = root + (slug ? slug + '/' : '');
            assert(html.includes(canonical), 'Canonical missing: ' + canonical);
            assert.equal((html.match(/<h1(?:\s[^>]*)?>/g)||[]).length, 1, 'H1 count: '+file);
            assert(html.includes('G-8CMRKXJN4S'), 'GA4 missing: ' + file);
            assert(html.includes('<title>'), 'Title missing: ' + file);
            assert(html.includes('description'), 'Description missing: ' + file);
            assert(html.includes('Make Ramen To Get Rich'), 'Game entity missing: ' + file);
            assert(sitemap.includes('<loc>'+canonical+'</loc>'), 'Sitemap missing: ' + canonical);
            for (const other of routes.slice(1)) assert(html.includes('/'+other+'/'), 'Navigation missing '+other+' on '+file);
            assert(!/Yorich|交接立项|详情资料|prompt\s*instructions|AGENTS\.md|CLAUDE\.md/i.test(html), 'Internal phrase in '+file);
          }
          const pages = JSON.parse(fs.readFileSync('content/generated/pages.json', 'utf8'));
          const home = JSON.parse(fs.readFileSync('content/generated/home.json', 'utf8'));
          for (const page of [home, ...pages]) {
            const html = read(page.slug ? path.join(page.slug, 'index.html') : 'index.html');
            for (const section of page.sections) {
              assert(html.includes('<h2>'+section.heading.replace(/&/g,'&amp;')+'</h2>'), 'Missing source H2: '+section.heading);
              for (const sub of section.subsections ?? []) {
                assert(html.includes('<h3>'+sub.heading.replace(/&/g,'&amp;')+'</h3>'), 'Missing source H3: '+sub.heading);
                for (const paragraph of sub.paragraphs) assert(html.includes(paragraph.slice(0,35).replace(/&/g,'&amp;')), 'Missing source paragraph: '+page.slug);
              }
              if (section.table) assert(html.includes('<table>') && html.includes(section.table.caption), 'Missing source table '+page.slug);
              for (const link of section.links ?? []) assert(html.includes('href="/'+link.slug+'/"'), 'Missing contextual link '+link.slug);
            }
            assert(html.includes('guide-mobile-navigation'), 'No mobile navigation '+page.slug);
            assert(html.includes('roblox.com/games/102155891663543'), 'Official Roblox CTA missing '+page.slug);
          }
          assert.equal((sitemap.match(/<loc>/g)||[]).length, 6, 'Unexpected sitemap URL count');
          const robots = read('robots.txt');
          assert(robots.includes('sitemap.xml'), 'robots.txt missing sitemap link');
          console.log('Six export routes, sitemap, H1, canonical, GA4 and internal content checks passed.');
          NODE
